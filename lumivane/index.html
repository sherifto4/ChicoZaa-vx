<style>
/* Layout concept: one night-sky screen. A glowing core feeds light through rotating channels.
   Deliberately single-look (dark). The accent (--lit) and backdrop change with the chosen theme. */
:root{
  color-scheme:dark;
  --bgA:#0a1024; --bgB:#18204a;
  --panel:rgba(22,31,66,.74); --panel-solid:#121a3a; --stroke:rgba(150,172,240,.17);

  --f-display:"Reem Kufi","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  height:100%;margin:0;padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:var(--bgA);
  background-image:radial-gradient(120% 70% at 50% -10%,var(--bgB),transparent 70%);
  color:var(--fg);font:400 15px/1.5 var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--lit);outline-offset:2px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{position:relative;height:100%;max-width:560px;margin:0 auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-block:10px}
.flip{display:inline-grid}
[dir=rtl] .flip svg{transform:scaleX(-1)}

.btn{min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--lit);color:var(--on-lit)}
.btn-ghost{border:1px solid var(--stroke);background:var(--panel)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--stroke);background:var(--panel);flex:none}
.icon-btn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--stroke);background:var(--panel);font-family:var(--f-mono);font-size:14px;flex:none}

/* home */
.home{overflow-y:auto;gap:12px;scrollbar-width:none}
.home::-webkit-scrollbar{display:none}
.topbar{display:flex;align-items:center;gap:10px}
.rank{flex:1;min-width:0}
.rank-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.rank-top b{color:var(--fg);font-weight:600}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--lit);border-radius:inherit;width:0;transition:width .6s}
.hero{display:grid;justify-items:center;gap:4px;text-align:center}
.herobox{position:relative;width:min(56vw,36vh,240px);aspect-ratio:1;max-width:100%}
.herobox canvas,.boardwrap canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:manipulation;cursor:pointer}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,10.5vw,50px);line-height:1.1;margin:0;text-wrap:balance}
.wordmark-sub{font-size:13px;color:var(--muted);margin:0;line-height:1.3}
.wordmark-sub.sp{letter-spacing:.34em;padding-inline-start:.34em}
.tag{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:30ch;text-wrap:balance}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--stroke);background:var(--panel);text-align:start;width:100%}
.mode .mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(var(--lit-rgb),.12);color:var(--lit)}
.mode .mi svg{width:24px;height:24px}
.mode h3{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.mode p{margin:0;font-size:13px;color:var(--muted);line-height:1.35}
.mode .meta{font-size:12px;color:var(--lit);display:flex;align-items:center;gap:5px;white-space:nowrap;font-weight:500}
.mode .meta svg{width:16px;height:16px}
.mode.main{border-color:rgba(var(--lit-rgb),.5);background:linear-gradient(135deg,rgba(var(--lit-rgb),.22),rgba(var(--lit-rgb),.05))}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:auto;padding-top:4px}
.nav button{display:grid;justify-items:center;gap:3px;padding:8px 2px;border-radius:14px;font-size:12px;color:var(--muted);line-height:1.25}

.gbar{display:grid;grid-template-columns:88px minmax(0,1fr) 88px;align-items:center;min-height:48px}

.gstat{justify-self:end;text-align:end;font-size:12px;color:var(--muted);line-height:1.35}

.boardwrap{position:relative;flex:1;min-height:0;margin-block:6px}

.tool{display:grid;justify-items:center;gap:5px;font-size:12px;color:var(--muted);position:relative}
.tool .icon-btn{width:56px;height:56px}
.tool .icon-btn svg{width:24px;height:24px}
.badge{position:absolute;top:-4px;inset-inline-end:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--lit);color:var(--on-lit);font:500 12px/22px var(--f-mono);text-align:center}
.result{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto;background:rgba(5,8,20,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .35s both}
.rcard{width:min(100%,360px);display:grid;gap:14px;padding:22px;border-radius:24px;background:var(--panel-solid);border:1px solid var(--stroke);text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.5),0 0 60px rgba(var(--lit-rgb),.14)}
.rcard h2{margin:0;font-family:var(--f-display);font-size:28px;line-height:1.2}
.stars{display:flex;justify-content:center;gap:8px}
.stars svg{width:46px;height:46px;fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linejoin:round;opacity:.55}
.stars svg.on{fill:var(--lit);stroke:var(--lit);opacity:1;filter:drop-shadow(0 0 10px rgba(var(--lit-rgb),.6));animation:pop .55s both;animation-delay:calc(var(--n)*.2s + .15s)}
.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:0}
.rows div{padding:10px 6px;border-radius:14px;background:rgba(255,255,255,.05)}
.rows dt{font-size:12px;color:var(--muted)}
.rows dd{margin:0;font-family:var(--f-mono);font-size:18px}
.note{margin:0;color:var(--lit);font-size:14px}
.acts{display:grid;gap:8px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(3,5,14,.6);animation:fade .25s both}
.panel{position:relative;width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;background:var(--panel-solid);border:1px solid var(--stroke);border-bottom:0;
  padding:14px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.grab{width:40px;height:4px;border-radius:9px;background:rgba(255,255,255,.2);margin:0 auto 12px}
.panel h2{margin:0 0 12px;font-family:var(--f-display);font-size:24px;line-height:1.2}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:54px;border-bottom:1px solid var(--stroke)}
.row small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.sw{width:48px;height:28px;border-radius:99px;background:rgba(255,255,255,.16);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true]{background:var(--lit)}
.sw[aria-checked=true]::after{transform:translateX(20px)}
[dir=rtl] .sw[aria-checked=true]::after{transform:translateX(-20px)}
.seg{display:flex;border:1px solid var(--stroke);border-radius:99px;overflow:hidden}
.seg button{padding:6px 16px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--lit);color:var(--on-lit);font-weight:600}
.danger{margin-top:16px;width:100%;color:#ff9b8a;border-color:rgba(255,155,138,.4)}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.theme{padding:14px;border-radius:16px;border:1px solid var(--stroke);background:linear-gradient(135deg,var(--a),var(--b));display:grid;gap:3px;text-align:start;min-height:92px;align-content:space-between}
.theme .dot{width:18px;height:18px;border-radius:50%;background:var(--l);box-shadow:0 0 14px var(--l)}
.theme b{display:block;font-weight:600}
.theme small{display:block;font-size:12px;color:rgba(255,255,255,.7);line-height:1.3}
.theme.on{outline:2px solid var(--l);outline-offset:1px}
.theme[disabled]{opacity:.5;cursor:default}
.alist{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04)}
.arow .ai{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--muted)}
.arow .ai svg{width:20px;height:20px}
.arow.on .ai{background:rgba(var(--lit-rgb),.16);color:var(--lit)}
.arow b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.arow small{color:var(--muted);font-size:13px;line-height:1.35}
.arow:not(.on) b{color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05)}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:20px}
.steps{display:grid;gap:12px;margin-bottom:16px}
.step{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.04)}
.step p{margin:0;font-size:15px;line-height:1.45}
.ill{width:64px;height:64px}
.ill .ln{stroke:var(--lit);stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ill .ar{stroke:var(--fg);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;z-index:80;inset-inline:0;bottom:calc(132px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.toast.top{bottom:auto;top:calc(22px + env(safe-area-inset-top,0px))}
.toast span{max-width:min(92%,420px);padding:10px 18px;border-radius:99px;background:#fff;color:#0b1024;font-weight:500;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:rise .25s both;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gprog{height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:4px}
.gprog i{display:block;height:100%;width:0;background:var(--lit);border-radius:inherit;transition:width .35s}
.gcap{text-align:center;color:var(--lit);font-size:14px;line-height:1.4;padding:8px 8px 0}
.gcap:empty{display:none}
.gtitle.tap{cursor:pointer}
.gtitle.tap small::after{content:" \25BE"}
.map{overflow-y:auto;gap:14px;scrollbar-width:none}
.map::-webkit-scrollbar{display:none}
.mapbar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px}
.mapt{text-align:center}
.mapt b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.15}
.mapt small{color:var(--muted);font-size:13px}
.worldnav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:16px;border:1px solid var(--stroke);background:var(--panel)}
.worldnav .wn{text-align:center;min-width:0}
.worldnav b{display:block;font-family:var(--f-display);font-size:20px;line-height:1.2}
.worldnav small{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.worldnav button:disabled{opacity:.3;cursor:default}
.lgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.lv{aspect-ratio:1;border-radius:16px;border:1px solid var(--stroke);background:var(--panel);display:grid;place-items:center;align-content:center;gap:3px;font-family:var(--f-mono);font-size:18px;position:relative;min-width:0}
.lv .st{display:flex;gap:2px;height:11px}
.lv .st svg{width:11px;height:11px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round}
.lv .st svg.on{fill:var(--lit);stroke:var(--lit)}

.lv svg.lk{width:18px;height:18px;color:var(--muted);fill:none}
.legend{margin:0;text-align:center;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lit);margin-inline-end:6px}
.rowbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:54px;border-bottom:1px solid var(--stroke);text-align:start}
.rowbtn svg{width:18px;height:18px;color:var(--muted)}
[dir=rtl] .rowbtn svg{transform:scaleX(-1)}
.code{width:100%;min-height:92px;margin:8px 0;padding:10px;border-radius:12px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:var(--fg);font:12px/1.4 var(--f-mono);resize:none;-webkit-user-select:text;user-select:text;direction:ltr;text-align:left}
.chg{margin:0 0 14px;padding-inline-start:20px;display:grid;gap:8px}
.chg li{line-height:1.5}
.about{display:grid;gap:6px;text-align:center;margin-bottom:12px}
.about .wordmark{font-size:34px}
.about p{margin:0;color:var(--muted);font-size:14px}
.about .by{color:var(--fg);font-size:15px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.2);opacity:0}60%{transform:scale(1.22)}to{transform:scale(1);opacity:1}}
.rm *,.rm *::before,.rm *::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}}
@media (max-height:640px){.herobox{width:min(40vw,30vh,200px)}.tag{display:none}}

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);

/* ============ core logic ============ */
const DX=[0,1,0,-1],DY=[-1,0,1,0]; /* N,E,S,W as bits 1,2,4,8 */
const rotm=(m,k=1)=>{k&=3;while(k--)m=((m<<1)|(m>>3))&15;return m};
function mulberry(a){a>>>=0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

/* cells[i] = {base,rot} | null. Returns lighting distance from source, loose ends and solved flag. */
function analyze(cols,rows,cells,src){
  const n=cols*rows,cur=i=>{const c=cells[i];return c?rotm(c.base,c.rot):0};
  const dist=new Array(n).fill(-1),par=new Array(n).fill(-1);dist[src]=0;const q=[src];
  for(let h=0;h<q.length;h++){
    const i=q[h],m=cur(i),x=i%cols,y=(i/cols)|0;
    for(let d=0;d<4;d++){
      if(!(m&(1<<d)))continue;
      const nx=x+DX[d],ny=y+DY[d];if(nx<0||ny<0||nx>=cols||ny>=rows)continue;
      const j=ny*cols+nx;if(!cells[j]||dist[j]>=0)continue;
      if(cur(j)&(1<<((d+2)&3))){dist[j]=dist[i]+1;par[j]=(d+2)&3;q.push(j)}
    }
  }
  let open=0,act=0;
  for(let i=0;i<n;i++){
    if(!cells[i])continue;act++;
    const m=cur(i),x=i%cols,y=(i/cols)|0;
    for(let d=0;d<4;d++){
      if(!(m&(1<<d)))continue;
      const nx=x+DX[d],ny=y+DY[d];
      if(nx<0||ny<0||nx>=cols||ny>=rows){open++;continue}
      const j=ny*cols+nx;
      if(!cells[j]||!(cur(j)&(1<<((d+2)&3))))open++;
    }
  }
  return{dist,par,open,act,lit:q.length,solved:open===0&&q.length===act};
}

/* Builds a puzzle that always has a solution: a random spanning tree (plus optional loops) is the answer, then tiles are rotated. */
function buildPuzzle(cols,rows,loopP,voidF,rand){
  const n=cols*rows,active=new Array(n).fill(true);
  const connected=a=>{
    const s=a.indexOf(true);if(s<0)return true;
    const seen=new Array(n).fill(false);seen[s]=true;const q=[s];let c=1;
    while(q.length){const i=q.pop(),x=i%cols,y=(i/cols)|0;
      for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(nx<0||ny<0||nx>=cols||ny>=rows)continue;const j=ny*cols+nx;if(a[j]&&!seen[j]){seen[j]=true;c++;q.push(j)}}}
    return c===a.filter(Boolean).length;
  };
  let want=Math.floor(n*voidF),tries=0;
  while(want>0&&tries++<n*6){const i=(rand()*n)|0;if(!active[i])continue;active[i]=false;if(connected(active))want--;else active[i]=true}
  const cells=[];for(let i=0;i<n;i++)if(active[i])cells.push(i);
  const mx=(cols-1)/2,my=(rows-1)/2,key=new Map(cells.map(i=>[i,Math.hypot(i%cols-mx,((i/cols)|0)-my)+rand()*1.5]));
  cells.sort((a,b)=>key.get(a)-key.get(b));
  const src=cells[0],mask=new Array(n).fill(0),inT=new Array(n).fill(false);inT[src]=true;const fr=[src];
  while(fr.length){
    const fi=rand()<.5?fr.length-1:(rand()*fr.length)|0,c=fr[fi],x=c%cols,y=(c/cols)|0,opts=[];
    for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(nx<0||ny<0||nx>=cols||ny>=rows)continue;const j=ny*cols+nx;if(active[j]&&!inT[j])opts.push([d,j])}
    if(!opts.length){fr.splice(fi,1);continue}
    const[d,j]=opts[(rand()*opts.length)|0];mask[c]|=1<<d;mask[j]|=1<<((d+2)&3);inT[j]=true;fr.push(j);
  }
  for(const c of cells){
    const x=c%cols,y=(c/cols)|0;
    for(const d of[1,2]){
      const nx=x+DX[d],ny=y+DY[d];if(nx>=cols||ny>=rows)continue;
      const j=ny*cols+nx;if(!active[j]||(mask[c]&(1<<d)))continue;
      if(rand()<loopP){mask[c]|=1<<d;mask[j]|=1<<((d+2)&3)}
    }
  }
  const out=new Array(n).fill(null),sol=new Array(n).fill(null);
  for(const c of cells){out[c]={base:mask[c],rot:(rand()*4)|0};sol[c]={base:mask[c],rot:0}}
  for(let g=0;g<40&&analyze(cols,rows,out,src).solved&&cells.length>1;g++){const c=out[cells[(rand()*cells.length)|0]];c.rot=(c.rot+1)&3}
  let par=0;
  for(const c of cells){const o=out[c];for(let k=0;k<4;k++){if(rotm(o.base,o.rot+k)===o.base){par+=k;break}}}
  let wrong=0,asym=0;
  for(const c of cells){const o=out[c];if(orients(o.base)>1){asym++;if(rotm(o.base,o.rot)!==o.base)wrong++}}
  return{cols,rows,cells:out,source:src,par,wrong,asym,sd:analyze(cols,rows,sol,src).dist};
}
/* number of distinct orientations of a tile shape (cross and empty = 1, straight = 2, others = 4) */
const orients=m=>m===0||m===15?1:(m===5||m===10?2:4);
/* Quality gate: every level is checked to be solvable from its own answer, and puzzles that start almost solved are rejected. */
function makePuzzle(cols,rows,loopP,voidF,rand){
  let best=null,last=null;
  for(let a=0;a<12;a++){
    const p=buildPuzzle(cols,rows,loopP,voidF,rand);last=p;
    const sol=p.cells.map(c=>c&&{base:c.base,rot:0});
    if(!analyze(cols,rows,sol,p.source).solved)continue;
    p.ratio=p.asym?p.wrong/p.asym:1;
    if(!best||p.ratio>best.ratio)best=p;
    if(p.asym<4||p.ratio>=.5)return p;
  }
  return best||last;
}

function merge(d,o){for(const k in o){if(o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k])&&d[k]&&typeof d[k]==='object')merge(d[k],o[k]);else d[k]=o[k]}return d}
/* keeps saved data safe to use: numbers stay numbers, levels never go below 1, unknown theme falls back */
function sanitize(s){
  const num=(o,k,min,def)=>{const v=Number(o[k]);o[k]=Number.isFinite(v)?Math.max(min,Math.floor(v)):def};
  num(s,'solved',0,0);num(s,'xp',0,0);num(s,'hints',0,3);s.hints=Math.min(s.hints,99);num(s,'zen',1,1);num(s,'ch',1,1);
  for(const k of['time','moves','three','bestTA','streak','bestStreak'])num(s.st,k,0,0);
  if(typeof s.st.lastDaily!=='string')s.st.lastDaily='';
  if(!THEMES.some(t=>t.id===s.theme))s.theme='lumen';
  if(!s.set||typeof s.set!=='object')s.set=defaults().set;
  if(s.set.lang!=='en')s.set.lang='ar';
  if(typeof s.set.loose!=='boolean')s.set.loose=true;
  if(typeof s.chStars!=='object'||!s.chStars)s.chStars={};
  if(typeof s.caps!=='object'||!s.caps)s.caps={};
  if(typeof s.ach!=='object'||!s.ach)s.ach={};
  s.v=2;return s;
}

/* ============ game state ============ */
let heroBoard=null,gameBoard=null,screen='home',sheetOpen=false;
const G={mode:'zen',level:1,moves:0,hints:0,undo:[],par:0,started:false,running:false,done:false,over:false,elapsed:0,lit:0,tiles:0,hudT:0,cap:'',ta:{left:180,n:0,live:false}};

function paramsFor(mode,lv,W,H){
  let cols,rows,loop,voidF;
  if(mode==='daily'){const d=new Date(),k=(d.getDate()+d.getMonth())%3;cols=6+k;rows=cols+2;loop=.14;voidF=.08}
  else if(mode==='ta'){cols=4+Math.min(3,Math.floor(lv/3));rows=cols+1+(lv%2);loop=Math.min(.2,.03*lv);voidF=lv>4?.06:0}
  else{
    cols=Math.min(12,3+Math.floor((lv-1)/4));rows=Math.min(14,cols+1+Math.floor((lv-1)/6));loop=Math.min(.32,.018*(lv-1));voidF=lv>=8?Math.min(.16,.012*(lv-7)):0;
    if(isBoss(lv)){cols=Math.min(12,cols+1);rows=Math.min(14,rows+1);voidF=Math.max(voidF,.06)}
  }
  if(mode!=='daily'){cols=Math.min(cols,Math.max(3,Math.floor(W/36)));rows=Math.min(rows,Math.max(3,Math.floor(H/36)))}
  return{cols,rows,loop,voidF};
}
function startLevel(mode,level){
  const keepClock=mode==='ta'&&G.ta.live&&!G.over;
  G.mode=mode;G.level=level;G.moves=0;G.hints=0;G.undo=[];G.started=keepClock;G.running=keepClock;G.done=false;G.elapsed=0;
  if(mode!=='ta')G.over=false;
  const wrap=$('#boardWrap'),P=paramsFor(mode,mode==='ta'?G.ta.n:level,wrap.clientWidth,wrap.clientHeight);
  const seed=mode==='daily'?hashStr('daily:'+todayStr()):mode==='ta'?(Math.random()*4294967295)>>>0:hashStr(mode+':'+level);
  const pz=makePuzzle(P.cols,P.rows,P.loop,P.voidF,mulberry(seed));
  G.par=pz.par;const info=gameBoard.load(pz);G.lit=info.lit;G.tiles=gameBoard.list.length;gameBoard.cursor=-1;
  hideResult();setCaption();updateHud();
}
/* short tips: first levels, and the first time voids or loops appear */
const CAPTXT={l1:'cap1',l2:'cap2',l3:'cap3',l6:'cap6',void:'cap_void',loop:'cap_loop'};
function capKey(){
  if(G.mode!=='zen'&&G.mode!=='ch')return '';
  const c=save.caps,b=gameBoard,lk='l'+G.level;
  if(CAPTXT[lk]&&!c[lk])return lk;
  if(!c.void&&b.list.length<b.cols*b.rows)return 'void';
  if(!c.loop){let e=0;for(const t of b.list)for(let d=0;d<4;d++)if(t.base&(1<<d))e++;if(e/2>b.list.length-1)return 'loop'}
  return '';
}
function setCaption(){G.cap=capKey();$('#gCap').textContent=G.cap?L(CAPTXT[G.cap]):''}
function dismissCaption(){if(!G.cap)return;save.caps[G.cap]=1;G.cap='';$('#gCap').textContent='';persist()}
function updateHud(){
  const m=G.mode,title=$('#gTitle');
  title.textContent=m==='daily'?L('m_daily'):m==='ta'?fmt(G.ta.left):L('lvl',{n:G.level});
  title.className=m==='ta'?'mono'+(G.ta.left<=10?' warn':''):'';
  $('.gtitle').classList.toggle('tap',m==='zen'||m==='ch');
  $('#gSub').textContent=m==='zen'?L('m_zen'):m==='ch'?L('m_ch'):m==='daily'?todayStr():L('ta_solved',{n:G.ta.n});
  $('#gStat').hidden=(m==='zen'||m==='ta');
  $('#gTime').textContent=fmt(G.elapsed);$('#gMoves').textContent=L('moves',{n:G.moves});
  $('#hintN').textContent=save.hints;
  $('#btnRestart').innerHTML=svg(m==='ta'?'skip':'refresh');$('#restartL').textContent=m==='ta'?L('skip'):L('restart');
  $('#gProgBar').style.width=(G.tiles?Math.round(G.lit/G.tiles*100):0)+'%';
  const live=L('lit',{a:G.lit,b:G.tiles});if($('#gLive').textContent!==live)$('#gLive').textContent=live;
}
function beginClock(){if(!G.started){G.started=true;G.running=true;if(G.mode==='ta')G.ta.live=true}}
function doRotate(t,d){
  if(G.done||sheetOpen)return;
  beginClock();dismissCaption();
  const before=G.lit,info=gameBoard.rotate(t,d);
  G.moves++;G.undo.push({i:t.i,d});G.lit=info.lit;
  Snd.tick();vib(6);if(info.lit>before)Snd.note(info.lit);
  updateHud();if(info.solved)onSolved();
}
function doUndo(){
  if(G.done||sheetOpen||!G.undo.length)return;
  const u=G.undo.pop(),t=gameBoard.grid[u.i];G.moves=Math.max(0,G.moves-1);G.lit=gameBoard.rotate(t,-u.d).lit;Snd.tick();updateHud();
}
function doHint(){
  if(G.done||sheetOpen)return;
  if(save.hints<=0){toast(L('nohint'));return}
  /* prefer tiles that are not lit yet, working outward from the core */
  let best=null,bs=1e9;
  for(const t of gameBoard.list){if(rotm(t.base,t.rot)===t.base)continue;const s=(t.litTo?1000:0)+gameBoard.sd[t.i];if(s<bs){bs=s;best=t}}
  if(!best){toast(L('nohint'));return}
  let k=1;while(rotm(best.base,best.rot+k)!==best.base)k++;
  save.hints--;G.hints++;persist();beginClock();dismissCaption();
  const info=gameBoard.rotate(best,k);G.lit=info.lit;Snd.hint();vib(10);updateHud();
  if(info.solved)onSolved();
}
function giveHint(n){save.hints=Math.min(99,save.hints+n);persist()}
function refreshHintUi(){$('#hintChip').innerHTML=svg('bulb')+`<span>${save.hints}</span>`;$('#hintN').textContent=save.hints}
function stars(){
  const lim3=Math.ceil(G.par*1.35)+2,lim2=Math.ceil(G.par*2)+4;
  let s=G.moves<=lim3?3:G.moves<=lim2?2:1;if(G.hints>0)s=Math.min(s,2);return s;
}
const ACH=[
 ['first',()=>save.solved>=1],['ten',()=>save.solved>=10],['fifty',()=>save.solved>=50],['hundred',()=>save.solved>=100],
 ['star3',e=>e.stars===3],['star10',()=>save.st.three>=10],
 ['clean',e=>e.tiles>=36&&e.hints===0],['fast',e=>e.tiles>=20&&e.hints===0&&e.time<10],['big',e=>e.tiles>=64],
 ['s3',()=>save.st.streak>=3],['s7',()=>save.st.streak>=7],['ta5',e=>e.ta>=5],['ta10',e=>e.ta>=10]
];
function checkAch(e){
  let delay=0;
  for(const[id,f]of ACH){
    if(save.ach[id])continue;
    let ok=false;try{ok=f(e||{})}catch(x){}
    if(ok){save.ach[id]=Date.now();setTimeout(()=>toast(L('ach_new',{n:L('a_'+id)})),900+delay);delay+=2400}
  }
}
function onSolved(){
  if(G.done)return;G.done=true;if(G.mode!=='ta')G.running=false;
  const mode=G.mode,lv=G.level,time=G.elapsed,tiles=G.tiles;
  gameBoard.celebrate();Snd.win();vib([20,40,30]);
  save.solved++;save.st.time+=time;save.st.moves+=G.moves;
  const wasNew=mode==='zen'?lv===save.zen:mode==='ch'?lv===save.ch:false;
  let st=0,xp=0,extra='';
  if(mode==='ch'){st=stars();xp=10+6*st;if(st>(save.chStars[lv]||0))save.chStars[lv]=st;if(wasNew)save.ch++;if(st===3)save.st.three++}
  else if(mode==='zen'){xp=8;if(wasNew)save.zen++}
  else if(mode==='daily'){
    xp=40;const td=todayStr();
    if(save.st.lastDaily!==td){save.st.streak=save.st.lastDaily===yestStr()?save.st.streak+1:1;save.st.lastDaily=td;save.st.bestStreak=Math.max(save.st.bestStreak,save.st.streak);giveHint(2);extra=L('daily_ok',{n:save.st.streak})+' · '+L('gotHints',{n:2})}
  }else{xp=6;G.ta.n++}
  if(wasNew&&isBoss(lv)){giveHint(2);xp+=30;extra=L('worldDone',{n:worldName(worldOf(lv))})}
  save.xp+=xp;
  if(mode!=='ta'&&save.solved%3===0){giveHint(1);extra=extra||L('gotHint')}
  checkAch({stars:st,tiles,hints:G.hints,time,ta:mode==='ta'?G.ta.n:0});
  persist();updateHud();
  if(mode==='ta'){setTimeout(()=>{if(screen==='game'&&G.mode==='ta'&&!G.over)startLevel('ta',0)},850);return}
  setTimeout(()=>{
    if(screen!=='game'||G.mode!==mode||G.level!==lv||!G.done)return;
    const rows=mode==='zen'?null:[[L('time'),fmt(time)],[L('movesL'),G.moves]];
    const acts=[];
    if(mode==='zen'){acts.push({p:1,l:L('next'),f:()=>startLevel('zen',lv+1)})}
    else if(mode==='ch'){acts.push({p:1,l:L('next'),f:()=>startLevel('ch',lv+1)},{l:L('retry'),f:()=>startLevel('ch',lv)})}
    else{acts.push({l:L('retry'),f:()=>startLevel('daily',0)})}
    acts.push({l:L('copy'),f:()=>copyText(L('share',{l:mode==='daily'?L('m_daily')+' '+todayStr():L('lvl',{n:lv}),s:mode==='ch'?'★'.repeat(st)+'☆'.repeat(3-st):'★',t:fmt(time)+' / '+L('moves',{n:G.moves})}))});
    acts.push({l:L('home'),f:goHome});
    showResult({title:L('solvedT'),stars:mode==='ch'?st:null,rows,note:extra,acts});
  },1000);
}
function endTA(){
  if(G.over)return;G.over=true;G.done=true;G.running=false;G.ta.left=0;G.ta.live=false;updateHud();
  const n=G.ta.n,rec=n>save.st.bestTA;if(rec)save.st.bestTA=n;
  checkAch({ta:n});persist();Snd.over();vib(40);
  showResult({title:L('ta_over'),rows:[[L('ta_n',{n:''}).trim(),n],[L('ta_best'),save.st.bestTA]],note:rec&&n>0?L('ta_new'):'',
    acts:[{p:1,l:L('ta_again'),f:()=>startTA()},{l:L('home'),f:goHome}]});
}
function startTA(){G.ta={left:180,n:0,live:false};G.over=false;startLevel('ta',0)}
function doRestart(){
  if(sheetOpen)return;
  if(G.mode==='ta'){
    if(G.done)return;
    if(G.ta.live){G.ta.left-=10;if(G.ta.left<=0){endTA();return}}
    startLevel('ta',0);return;
  }
  startLevel(G.mode,G.level);
}
function copyText(txt){
  const ok=()=>toast(L('copied'));

}

const b64e=s=>{const b=new TextEncoder().encode(s);let r='';for(const c of b)r+=String.fromCharCode(c);return btoa(r)};
const b64d=s=>{const r=atob(s),b=new Uint8Array(r.length);for(let i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return new TextDecoder().decode(b)};

function importCode(s){
  s=String(s||'').trim();if(s.indexOf('LV2:')!==0)return false;

    save=adopt(o);flush();return true;
  }catch(e){return false}
}

bc.addEventListener('pointerdown',e=>{e.preventDefault();gameBoard.cursor=-1;const t=gameBoard.hit(e.clientX,e.clientY);if(t)doRotate(t,(e.button===2||e.shiftKey)?-1:1)});
bc.addEventListener('contextmenu',e=>e.preventDefault());
const hc=$('#heroCanvas');
hc.addEventListener('pointerdown',e=>{e.preventDefault();Snd.unlock();const t=heroBoard.hit(e.clientX,e.clientY);if(t){heroBoard.rotate(t,1);Snd.tick();vib(5)}});
document.addEventListener('pointerdown',()=>Snd.unlock(),{once:true,capture:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){flush();Snd.suspend()}else Snd.wake()});
addEventListener('pagehide',flush);
/* hooks used by the native Android shell (harmless on the web) */
window.lumivaneSuspend=()=>{flush();Snd.suspend()};
window.lumivaneResume=()=>{if(!document.hidden)Snd.wake()};
/* keyboard: arrows move, space/enter rotates (shift = other way), U undo, H hint, R restart, Esc back */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){handleBack();return}
  if(screen!=='game'||sheetOpen||e.ctrlKey||e.metaKey||e.altKey)return;
  const b=gameBoard,k=e.key,mv={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[k];
  if(mv){
    e.preventDefault();if(G.done)return;
    if(b.cursor<0||!b.grid[b.cursor])b.cursor=b.src;
    else{let x=b.grid[b.cursor].x+mv[0],y=b.grid[b.cursor].y+mv[1];
      while(x>=0&&y>=0&&x<b.cols&&y<b.rows&&!b.grid[y*b.cols+x]){x+=mv[0];y+=mv[1]}
      if(x>=0&&y>=0&&x<b.cols&&y<b.rows)b.cursor=y*b.cols+x}
    return;
  }
  if(k===' '||k==='Enter'){
    if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;
    e.preventDefault();if(b.cursor<0||!b.grid[b.cursor])b.cursor=b.src;
    const t=b.grid[b.cursor];if(t)doRotate(t,e.shiftKey?-1:1);return;
  }
  if(k==='u'||k==='U')doUndo();else if(k==='h'||k==='H')doHint();else if(k==='r'||k==='R')doRestart();
});

/* ============ hero demo + main loop ============ */
let heroT=0,heroWait=0;
function newHero(){heroBoard.load(makePuzzle(5,5,.12,0,mulberry((Math.random()*4294967295)>>>0)));heroT=0;heroWait=0}
function heroTick(dt){
  heroBoard.frame(dt);
  if(heroBoard.info&&heroBoard.info.solved){heroWait+=dt;if(heroWait>2.4)newHero();return}
  heroWait=0;heroT+=dt;
  if(heroT>.8){heroT=0;const wrong=heroBoard.list.filter(t=>rotm(t.base,t.rot)!==t.base);
    if(wrong.length){const t=wrong[(Math.random()*wrong.length)|0];heroBoard.rotate(t,1)}}
}
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(.1,Math.max(0,(now-last)/1000));last=now;
  if(document.hidden)acc=0;
  else if(acc>=(save.set.bat?.03:0)){
    const d=acc,dt=Math.min(.05,d);acc=0;
    if(screen==='home')heroTick(dt);
    else if(screen==='game'){
      gameBoard.frame(dt);
      /* the Time Attack clock keeps running while the next puzzle loads */
      const ticking=G.running&&!sheetOpen&&(!G.done||(G.mode==='ta'&&!G.over));
      if(ticking){
        G.elapsed+=d;G.hudT+=d;
        if(G.mode==='ta'){G.ta.left-=d;if(G.ta.left<=0)endTA()}
        if(G.hudT>.2){G.hudT=0;updateHud()}
      }
    }
  }
  requestAnimationFrame(loop);
}

/* ============ boot ============ */
let booted=false;
function start(data){
  if(booted)return;booted=true;
  heroBoard=new Board(hc,$('#heroBox'),64);
  gameBoard=new Board(bc,$('#boardWrap'),112);
  new ResizeObserver(()=>heroBoard.layout()).observe($('#heroBox'));
  new ResizeObserver(()=>gameBoard.layout()).observe($('#boardWrap'));
  document.documentElement.classList.toggle('rm',save.set.rm);
  applyTheme();applyLang();newHero();
  if(data&&data.mode&&data.mode!=='ta'&&data.mode!=='daily'){show('game');startLevel(data.mode,data.level||1)}
  else if(save.tutorial&&save.seenVer!==APP_VERSION)setTimeout(()=>{if(!sheetOpen&&screen==='home')sheetNew()},700);
  if(save.seenVer!==APP_VERSION){save.seenVer=APP_VERSION;persist()}
  requestAnimationFrame(t=>{last=t;loop(t)});
}
try{window.claude?.hot?.snapshot?.(()=>screen==='game'?{mode:G.mode,level:G.level}:{})}catch(e){}
try{window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{})}catch(e){start({})}
})();
